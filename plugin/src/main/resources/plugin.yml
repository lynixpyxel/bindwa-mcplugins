name: BindWA
version: '${version}'
main: com.dozzy.BindWAPlugin
api-version: '1.20'
author: Dozzy
description: Hubungkan nomor WhatsApp ke akun Minecraft untuk verifikasi dan reward
softdepend:
  - Floodgate
  - AuthMe

commands:
  bindwa:
    description: Hubungkan nomor WhatsApp ke akun Minecraft
    usage: /bindwa
    aliases: [wabind, whatsapp]
  chat:
    description: Kirim pesan chat ke grup WhatsApp dan Discord
    usage: /chat <pesan>
    aliases: [wa]
  elytraboard:
    description: Tampilkan leaderboard elytra pemain
    usage: /elytraboard
    aliases: [elytraleaderboard, elytratop]
  elytracheck:
    description: Cek total pengambilan elytra pemain tertentu
    usage: /elytracheck <player>

permissions:
  bindwa.admin:
    description: Izin untuk me-reload konfigurasi plugin BindWA dan unbind data
    default: op
  bindwa.chat:
    description: Izin untuk menggunakan perintah /chat dan /wa ke WhatsApp/Discord
    default: true
  elytratracker.admin:
    description: Izin admin untuk cek data elytra pemain
    default: op
